# Render Free + external Neon Free PostgreSQL. No paid disk.
services:
  - type: web
    name: splot-zai
    runtime: docker
    repo: https://github.com/CampiPL/ZAI
    branch: main
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SESSION_TTL_SECONDS
        value: "3600"
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "8000"
      # The platform terminates TLS and proxies to this internal HTTP listener.
      - key: REQUIRE_HTTPS
        value: "false"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
