[project]
name = "splot-observatory"
version = "1.0.0"
description = "Obserwatorium mikroklimatu — projekt ZAI 26Z"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "argon2-cffi>=23.1,<26",
  "python-dotenv>=1,<2",
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "fpdf2>=2.8,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
