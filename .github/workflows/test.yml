name: Testy projektu
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: splot
          POSTGRES_PASSWORD: ci-ephemeral-only
          POSTGRES_DB: splot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U splot -d splot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Konto i baza są tworzone tylko w efemerycznym środowisku CI.
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: Ci-ephemeral-account-2026
      DATABASE_PATH: data/ci.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.7'
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
      - run: uv run pytest -q
      - name: PostgreSQL — ta sama pula testów
        run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql://splot:ci-ephemeral-only@localhost:5432/splot_test
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start i dane demonstracyjne
        run: |
          uv run python scripts/serve.py > /tmp/splot.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then break; fi
            sleep 1
          done
          uv run python scripts/seed.py
      - run: uv run python scripts/contract.py --stage E1
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            artifacts/
            frontend/test-results/
